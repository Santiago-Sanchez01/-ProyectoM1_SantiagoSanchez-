<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
	<title> Proyecto integrador</title>
</head>
<body>
    <header> 
        <h1>Proyecto integrador</h1>
        <p>Generá tu paleta de colores</p>
    </header>

	<main>
	
        <section>
         <h2>Configuración</h2>

         <label for="cantidad">Cantidad de colores</label>

         <select id="cantidad">
          <option value="6">6 colores</option>
          <option value="8">8 colores</option>
          <option value="9">9 colores</option>
         </select>

         <label for="formato">Formato de color</label>

         <select id="formato">
          <option value="hex">HEX</option>
          <option value="hsl">HSL</option>
         </select>

        <div class="acciones">

          <button id="generar" type="button">
            Generar paleta
          </button>

          <button id="guardar" type="button">
            💾 Guardar paleta
         </button>

         <button id="cargar" type="button">
            📂 Cargar paleta
          </button>

         </div>
        </section>

        <section>
          <h2> Tu paleta</h2>
          <div id="paleta" aria-label="paleta de colores generada"></div>

          <p id="mensaje" aria-live="polite"></p>
        </section>

    </main>

    <footer>      
   <p> Desarrollado por Santiago Nicolas Sanchez en 2026 </p>
    </footer>
    <script src="apps.js"></script>

</body>


</html>
