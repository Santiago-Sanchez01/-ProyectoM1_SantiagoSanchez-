<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
	<title> Proyecto integrador</title>
</head>
<body>
    <header> 
        <h1>Proyecto integrador</h1>
        <p>Generá tu paleta de colores</p>
    </header>

	<main>
	
      <section> 
           <h2> Configuración</h2>

        <label for="cantidad"> Cantidad de colores</label>

         <select id="cantidad">
          <option value="6"> 6 colores </option>
          <option value="8"> 8 colores </option>
          <option value="9"> 9 colores </option>
        </select>

        <button id="generar">
            Generar paleta
        </button>

      </section>

     <section>
         <h3> Tu paleta</h3>
         <div id="paleta"></div>

         <p id="mensaje" aria-live="polite"></p>
      </section>

    </main>

    <footer>      
   <p> Diseñado por Santiago Nicolas Sanchez en 2026 </p>
    </footer>
    <script src="apps.js"></script>

</body>


</html>
